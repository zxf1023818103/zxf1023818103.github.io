# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  oss-deploy:
    environment:
      name: aliyun-oss
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Setup Aliyun CLI Credentials
        run: |
          aliyun plugin install --names aliyun-cli-oss
          
          aliyun configure set \
            --access-key-id ${{ vars.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            --region ${{ vars.ALIYUN_OSS_REGION }} \
            --profile oss-deployer \
            --mode AK \
            --language en

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages

      - name: Extract Artifact
        run: |
          mkdir _site
          tar -xvf artifact.tar -C _site/

      - name: Deploy to Aliyun OSS
        id: oss-deployment
        run: |
          aliyun oss sync _site/ oss://${{ secrets.ALIYUN_OSS_BUCKET }}/ -f --delete

      - name: Refresh Aliyun CDN
        run: |
          aliyun cdn RefreshObjectCaches \
            --ObjectPath "https://${{ vars.ALIYUN_CDN_DOMAIN }}/" \
            --ObjectType Directory \
            --profile oss-deployer

